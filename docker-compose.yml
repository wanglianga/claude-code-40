services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistdb}
      POSTGRES_USER: ${POSTGRES_USER:-assist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assist123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 数据库不发布到宿主端口，仅在 compose 内部网络访问

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-assistdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-assist}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-assist123}
      JWT_SECRET: ${JWT_SECRET:-assist-platform-dev-secret-key-2026-09-change-me}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # 后端不直接发布到宿主，由前端 nginx 反向代理 /api

  frontend:
    build: ./frontend
    ports:
      - "${CC_PUBLISH_PORT}:8080"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  uploads:
