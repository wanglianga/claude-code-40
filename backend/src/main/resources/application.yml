server:
  port: 8080

spring:
  application:
    name: assist-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/assistdb}
    username: ${SPRING_DATASOURCE_USERNAME:assist}
    password: ${SPRING_DATASOURCE_PASSWORD:assist123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

app:
  jwt-secret: ${JWT_SECRET:assist-platform-dev-secret-key-2026-09-change-me}
  jwt-ttl-hours: 72

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
